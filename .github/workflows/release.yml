name: Release Asset
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  attach-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload nordpol-card.js to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nordpol-card.js
          generate_release_notes: true
