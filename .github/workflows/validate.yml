name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with: { category: plugin }
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --check dist/nordpol-card.js
      - name: No private data
        run: |
          ! grep -rEn "192\.168\.|ntfy\.sh|ses-home" --include=*.js --include=*.yaml --include=*.md . | grep -v "README.md"
