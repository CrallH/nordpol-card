# Ejemplo en español – tarjeta en español, cuenta atrás por defecto a medianoche (24→25 dic.)
views:
  - title: Polo Norte
    path: polo-norte
    icon: mdi:pine-tree
    type: panel
    background: radial-gradient(ellipse at 50% -10%, #1f3b78 0%, #0b1a3a 45%, #050b1f 100%) fixed
    cards:
      - type: custom:nordpol-board-card
        language: es
        # hero:
        #   target: "12-25 08:00"       # opcional – por defecto "12-25 00:00" en español (o p. ej. "12-25 08:00" o "01-06 08:00")
        cams:
          cams:
            - label: "CAM 01 – CORRAL DE LOS RENOS"
            - label: "CAM 02 – TALLER DE JUGUETES"
            - label: "CAM 03 – SALA DE CORREO"
            - label: "CAM 04 – PANADERÍA"
        sleigh: { eta: "23:59" }
        nice:
          store: todo.nordpol_nice_list           # lista de tareas dedicada (también guarda el diario de los elfos)
          # log_entity: input_text.nordpol_elf_log
        elf: {}
