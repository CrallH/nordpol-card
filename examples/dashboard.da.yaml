# Dansk eksempel – samme kort, sproget sat til dansk
views:
  - title: Nordpolen
    path: nordpolen
    icon: mdi:pine-tree
    type: panel
    background: radial-gradient(ellipse at 50% -10%, #1f3b78 0%, #0b1a3a 45%, #050b1f 100%) fixed
    cards:
      - type: custom:nordpol-board-card
        language: da
        cams:
          cams:
            - label: "CAM 01 – RENSDYRSTALD"
            - label: "CAM 02 – LEGETØJSVÆRKSTED"
            - label: "CAM 03 – POSTRUM"
            - label: "CAM 04 – BAGERI"
        sleigh: { eta: "23:59" }
        nice:
          store: todo.nordpol_nice_list           # dedikeret Local To-do liste (gemmer også nisseloggen)
          # log_entity: input_text.nordpol_nisselog
        elf: {}
