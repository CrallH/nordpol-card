# Deutsches Beispiel – Karte auf Deutsch, Countdown standardmäßig auf Heiligabend (24.12. 18:00)
views:
  - title: Nordpol
    path: nordpol
    icon: mdi:pine-tree
    type: panel
    background: radial-gradient(ellipse at 50% -10%, #1f3b78 0%, #0b1a3a 45%, #050b1f 100%) fixed
    cards:
      - type: custom:nordpol-board-card
        language: de
        # hero:
        #   target: "12-24 18:00"       # optional – Standard "12-24 18:00" (Heiligabend), oder z. B. "12-25 08:00"
        cams:
          cams:
            - label: "CAM 01 – RENTIERGEHEGE"
            - label: "CAM 02 – SPIELZEUGWERKSTATT"
            - label: "CAM 03 – POSTSTELLE"
            - label: "CAM 04 – BÄCKEREI"
        sleigh: { eta: "23:59" }
        nice:
          store: todo.nordpol_nice_list           # eigene Local-To-do-Liste (speichert auch das Wichtel-Logbuch)
          # log_entity: input_text.nordpol_elf_log
        elf: {}
