# Exemple français – la carte est en français, compte à rebours à minuit (24→25 déc.) par défaut
views:
  - title: Pôle Nord
    path: pole-nord
    icon: mdi:pine-tree
    type: panel
    background: radial-gradient(ellipse at 50% -10%, #1f3b78 0%, #0b1a3a 45%, #050b1f 100%) fixed
    cards:
      - type: custom:nordpol-board-card
        language: fr
        # hero:
        #   target: "12-25 08:00"       # optionnel – par défaut "12-25 00:00" en français (ou ex. "12-25 08:00" pour le matin de Noël)
        cams:
          cams:
            - label: "CAM 01 – ENCLOS DES RENNES"
            - label: "CAM 02 – ATELIER DES JOUETS"
            - label: "CAM 03 – TRI DU COURRIER"
            - label: "CAM 04 – BOULANGERIE"
        sleigh: { eta: "23:59" }
        nice:
          store: todo.nordpol_nice_list           # liste de tâches dédiée (enregistre aussi le journal des lutins)
          # log_entity: input_text.nordpol_elf_log
        elf: {}
